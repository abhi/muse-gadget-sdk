[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "musegadget"
version = "0.1.0"
description = "Make any Linux computer into a Muse Home Link that pairs with the Muse app"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
# cryptography comes from the distro (python3-cryptography) on devices; the
# floor is Debian 11 / Raspberry Pi OS Bullseye's 3.3.2.
dependencies = ["cryptography>=3.3.2", "websockets>=13"]

[project.scripts]
musegadget = "musegadget.cli:main"
muse-reachy = "musegadget.reachy_cli:main"

[project.optional-dependencies]
test = ["pytest"]
reachy = ["reachy-mini>=1.9,<2", "numpy>=1.24", "av>=12", "webrtcvad-wheels>=2.0.14"]
reachy-wake = ["sherpa-onnx==1.13.8", "sentencepiece==0.2.2"]
reachy-wake-vosk = ["vosk==0.3.45"]
reachy-stt-streaming = ["sherpa-onnx==1.13.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musegadget = ["data/*", "data/face_tracking/*", "data/companion_protocol_v1/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
